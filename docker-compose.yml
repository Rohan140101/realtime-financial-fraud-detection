name: event-platform
services: 
  db: 
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_DB: event-platform
      POSTGRES_USER: event-platform
      POSTGRES_PASSWORD: stonybrook123
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "event-platform"]
    volumes: 
      - db-data:/var/lib/postgresql

  cache: 
    image: redis
    restart: always
    ports:
      - "6379:6379"

  api: 
    build: 
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.docker
    ports:
      - "8080:8080"
    depends_on: 
      db:
        condition: service_healthy
      cache:
        condition: service_started
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "api"}]'

  redpanda:
    image: redpandadata/redpanda:v23.2.17
    command: 
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --memory=512M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: 
    - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    ports:
      - "8085:8080"
    depends_on:
      - redpanda

  consumer: 
    build: 
      context: .
      dockerfile: docker/consumer.Dockerfile
    env_file: .env.docker
    depends_on: 
      db:
        condition: service_healthy
      cache:
        condition: service_started
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "consumer"}]'

  fraud-consumer: 
    build: 
      context: .
      dockerfile: docker/fraud-consumer.Dockerfile
    env_file: .env.docker
    depends_on: 
      db:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "fraud-consumer"}]'

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DATADOG_API_KEY}
      DD_SITE: us5.datadoghq.com
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_APM_RECEIVER_PORT: "8126"
      DD_APM_DD_URL: "https://trace.agent.us5.datadoghq.com"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      DD_PROCESS_AGENT_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8126:8126"
    depends_on:
      - api
      - consumer
      - fraud-consumer
    

volumes:
  db-data:
  redpanda_data: